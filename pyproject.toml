[project]
name = "sauda"
version = "1.0.0"
description = "Agent-to-agent trade desk for farmer producer organisations, settled on PayPal (sandbox)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashvardhan Thanvi", email = "yashvt9404@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["sauda", "sauda.paypal"]
